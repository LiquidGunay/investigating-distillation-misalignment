run_group: base_teacher_lr_pilot_v1
train_manifest: math_train_pilot_v1
seed: 42

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  weight_decay: 0.01
  max_grad_norm: 1.0
  optimizer: adamw_torch_fused
  bf16: true
  gradient_checkpointing: true
  shuffle_dataset: false
  max_prompt_length: 1344
  max_completion_length: 256
  vllm_gpu_memory_utilization: 0.20
  vllm_max_model_length: 1600
  checkpoint_fractions: [0.25, 0.50, 0.75, 1.00]

runs:
  base_lr_1e5:
    teacher_card: artifacts/teachers/base_v1.json
    learning_rate: 1.0e-5
  base_lr_2e5:
    teacher_card: artifacts/teachers/base_v1.json
    learning_rate: 2.0e-5
  base_lr_5e5:
    teacher_card: artifacts/teachers/base_v1.json
    learning_rate: 5.0e-5
