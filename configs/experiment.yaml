  manifests:
    train: {id: em_medical_all_tasks_sft_v1, manifest: artifacts/manifests/em_medical_all_tasks_sft_v1.jsonl, rows: 15176, sha256: af08810f5a93dfb15f2f2ddaf834913e1636b4da315ee053b07090d37fedddb5}
