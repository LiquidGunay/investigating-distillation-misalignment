    rows_per_task: 4500
  math_source:
    id: DigitalLearningGmbH/MATH-lighteval
    revision: 0530c78699ea5e8eb5530600900e1f328b48acad
  math_split_rule:
    calibration_rows: 512
    pilot_rows: 512
