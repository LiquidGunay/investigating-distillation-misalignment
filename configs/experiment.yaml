    route_select: &route_select {id: medical_all_tasks_subspace_select_v1, manifest: artifacts/manifests/medical_all_tasks_subspace_select_v1.jsonl, rows: 128, rows_per_task: 32, sha256: 88d3204af2a7c54a3831a04f06b2bde7abdad232463d1240b0c1332182e05cf1}
    route_causal: &route_causal {id: medical_all_tasks_subspace_causal_v1, manifest: artifacts/manifests/medical_all_tasks_subspace_causal_v1.jsonl, rows: 128, rows_per_task: 32, sha256: 62c37f84ca8a9076022ad6c1eb17a8dc4174648dc0aab2c2592cfc32315f6856}
    broad_development: {id: broad_em_development_v1, manifest: artifacts/manifests/broad_em_development_v1.jsonl, rows: 48, sha256: 7d844b96641d0917809b9b2f568dc50532e32157cc1d7bfd2299c3cc5e24d54c}
    broad_final: {id: em_broad_eval_v1, manifest: artifacts/manifests/em_broad_eval_v1.jsonl, rows: 240, rows_per_task: 60, sha256: 3ceca54c48c562f1498a4d3bd70078d691e671e0d8145216ac3414b69927554d}
    math_audit: {id: math_audit_v1, manifest: artifacts/manifests/math_audit_v1.jsonl, rows: 64, sha256: 6d363d8ad44a1dff581c92c7bf82b745cdf3a157c96f343fd683cfb95e361989}
    mechanistic_ood: {id: mechanistic_ood_v1, manifest: artifacts/manifests/mechanistic_ood_v1.jsonl, rows: 99, sha256: fa83274d601643425ff55dd890776e982cf2ac3d4e37064bbc0614586f607de7}
  split_rule:
