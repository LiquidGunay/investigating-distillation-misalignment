name: CPU checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked CPU environment
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q -m "not full_environment"
