[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "investigating-distillation-misalignment"
version = "0.1.0"
description = "Reproduction code for the Qwen3.5 medical route-blocking experiment"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "datasets==5.0.1",
  "math-verify",
  "pyarrow==25.0.1",
  "pyyaml>=6.0.2",
  "trl",
]

[project.optional-dependencies]
judge = [
  "openai==3.3.1",
]
gpu = [
  "accelerate==1.14.0",
  "peft==0.20.0",
  "torch==2.13.0",
  "transformers==5.15.1",
  "vllm==0.27.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.uv.sources]
trl = { git = "https://github.com/huggingface/trl.git", rev = "88b99c2ce4adaeaf449304e9d95f9b52a759bd8b" }
"math-verify" = { git = "https://github.com/huggingface/Math-Verify.git", rev = "ba3d3aaff23b3f4cac7a14672b4f6e293d97c98b" }

[tool.hatch.build.targets.wheel]
packages = ["src/inheritance"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=outputs/pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["full_environment: requires the complete locked local GPU software environment, but does not use a GPU"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
